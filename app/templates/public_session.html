<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>{{ sess.title }}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="public">
  <main class="container narrow center">
    <h1>{{ sess.title }}</h1>
    {% if sess.notes %}
      <p class="notes">{{ sess.notes }}</p>
    {% endif %}
    <audio
      id="exam-audio"
      preload="metadata"
      controlsList="nodownload noplaybackrate noremoteplayback"
      disablepictureinpicture
      disableremoteplayback
      oncontextmenu="return false;">
      <source src="/stream/{{ token }}" type="{{ sess.audio_file.content_type }}" />
      Your browser does not support audio playback.
    </audio>
    <div class="player">
      <button id="play-btn" type="button" class="play-btn" aria-label="Play audio">Play</button>
      <span id="play-status" class="muted" aria-live="polite"></span>
    </div>
    <p class="muted">
      Available until: <span id="ends-at" data-ends="{{ sess.ends_at.isoformat() }}"></span>
      &middot; <span id="time-remaining"></span>
    </p>
    <p class="footer-note">Do not share this link.</p>
  </main>
  <script>
    (function () {
      const audio = document.getElementById('exam-audio');
      const btn = document.getElementById('play-btn');
      const statusEl = document.getElementById('play-status');

      if (audio) {
        audio.playbackRate = 1.0;
        audio.addEventListener('ratechange', function () {
          if (audio.playbackRate !== 1.0) audio.playbackRate = 1.0;
        });
        audio.addEventListener('play', function () {
          btn.disabled = true;
          btn.textContent = 'Playing';
          if (statusEl) statusEl.textContent = '';
        });
        audio.addEventListener('ended', function () {
          btn.disabled = true;
          btn.textContent = 'Done';
          if (statusEl) statusEl.textContent = 'Playback finished.';
        });
        audio.addEventListener('error', function () {
          btn.disabled = true;
          btn.textContent = 'Unavailable';
          if (statusEl) statusEl.textContent = 'Audio unavailable.';
        });
      }

      if (btn) {
        btn.addEventListener('click', function () {
          if (!audio || !audio.paused) return;
          const p = audio.play();
          if (p && typeof p.catch === 'function') {
            p.catch(function () {
              btn.disabled = false;
              btn.textContent = 'Play';
              if (statusEl) statusEl.textContent = 'Tap Play to start.';
            });
          }
        });
      }
    })();
  </script>
  <script>
    (function () {
      const endsEl = document.getElementById('ends-at');
      const remainEl = document.getElementById('time-remaining');
      if (!endsEl) return;
      const endsAt = new Date(endsEl.dataset.ends);
      endsEl.textContent = endsAt.toLocaleString();
      function tick() {
        const ms = endsAt - new Date();
        if (ms <= 0) {
          remainEl.textContent = 'expired — refresh page';
          return;
        }
        const s = Math.floor(ms / 1000);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        remainEl.textContent = (h > 0 ? h + 'h ' : '') + m + 'm ' + sec + 's remaining';
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
