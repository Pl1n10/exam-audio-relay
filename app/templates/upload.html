{% extends "base.html" %}
{% block title %}Upload — {{ app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Upload audio file</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/upload" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label>Display name
      <input type="text" name="display_name" required maxlength="255" />
    </label>
    <label>Description (optional)
      <textarea name="description" rows="3" maxlength="2000"></textarea>
    </label>
    <label>File (.mp3, .wav, .m4a, .ogg)
      <input type="file" name="file" accept=".mp3,.wav,.m4a,.ogg,audio/*" required />
    </label>
    <p class="muted">Max upload size is configured by the server.</p>
    <button type="submit">Upload</button>
  </form>
</section>
{% endblock %}
